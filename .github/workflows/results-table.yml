name: Update results table
on:
  push:
    branches: [main]
    paths:
      - docs/results.json
      - scripts/results-table.mjs
      - .github/workflows/results-table.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: results-table
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate and save public results table
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/results-table.mjs
            git add docs/RESULTS.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update readable public results table'
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
